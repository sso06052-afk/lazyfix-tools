name: stock prices watchdog

# 종가 스냅샷이 "조용히" 낡는 걸 잡아요.
#
# 2026-09-23 사고: GitHub Actions 예약 실행이 2~5시간씩 밀리다가 그날 국내 실행은 아예 돌지 않았고,
# prices.json의 최신 종가가 32종목 전부 전날 것이었어요. 저녁에 앱을 연 사람은 하루 지난 가격으로
# 주문했는데, 실패한 게 아니라 '실행이 없었던' 거라 아무 알림도 안 갔어요.
#
# 수집 자체는 야후가 주는 최신 봉을 그대로 쓰니 휴장일에도 틀리지 않아요. 유일한 고장 유형이
# "실행이 안 됨"이라, 여기서는 **마지막 갱신 시각이 얼마나 지났는지**만 봅니다. 오래됐으면 job을
# 실패시켜 GitHub이 저장소 소유자에게 메일을 보내게 해요.
on:
  schedule:
    - cron: '17 12 * * 1-5'   # 21:17 KST — 국내 마감(15:30) + 넉넉히 뒤
    - cron: '17 4 * * 2-6'    # 13:17 KST — 미국 마감 + 넉넉히 뒤
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 마지막 갱신이 너무 오래됐는지 확인
        run: |
          python - <<'PY'
          import datetime, json, pathlib, sys

          MAX_AGE_HOURS = 8

          data = json.loads(pathlib.Path('data/stocks/prices.json').read_text(encoding='utf-8'))
          updated = datetime.datetime.fromisoformat(data['updatedAt'])
          now = datetime.datetime.now(datetime.timezone.utc)
          age = (now - updated).total_seconds() / 3600

          dates = sorted({s['date'] for s in data['symbols'].values()})
          print(f'updatedAt: {updated.isoformat()}  ({age:.1f}시간 전)')
          print(f'종가 날짜: {", ".join(dates)}')

          if age > MAX_AGE_HOURS:
              print(f'::error::종가 스냅샷이 {age:.1f}시간째 갱신되지 않았어요(한도 {MAX_AGE_HOURS}시간). '
                    'stock-prices 워크플로가 예약대로 돌고 있는지 확인하고, 필요하면 '
                    'workflow_dispatch로 한 번 돌려 주세요. 앱은 그동안 지난 종가를 보여주고 있어요.')
              sys.exit(1)

          print('정상이에요.')
          PY
