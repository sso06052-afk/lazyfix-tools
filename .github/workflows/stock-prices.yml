name: stock prices snapshot

# 주식 모의투자(토스 미니앱)가 읽는 종가 스냅샷을 갱신해요.
# 국내 장 마감 15:30 KST, 미국 장 마감 뒤는 06:00 KST쯤.
#
# 왜 이렇게 많이 거나 — GitHub Actions 예약 실행은 **자주, 크게 밀려요.**
# 실측(2026-09-23): 16:10 예정이 21:33에, 17:40 예정이 22:38에 돌았어요(5시간 지연).
# 그날 저녁 내내 사용자는 어제 종가를 봤어요. 한 번 밀려도 다음 게 걸리도록 촘촘히 겁니다.
# 이미 최신이면 스크립트가 바로 끝나고 커밋도 안 하니 밀려 쌓여도 부담이 없어요.
# 정시(:00)는 무료 러너가 가장 붐벼서 더 밀리니 분을 흩어 둡니다.
on:
  schedule:
    # 국내: 16:07 ~ 21:07 KST (07:07 ~ 12:07 UTC)
    - cron: '7 7 * * 1-5'
    - cron: '23 8 * * 1-5'
    - cron: '41 9 * * 1-5'
    - cron: '13 11 * * 1-5'
    - cron: '37 12 * * 1-5'
    # 미국: 07:07 ~ 12:07 KST (22:07 ~ 03:07 UTC)
    - cron: '7 22 * * 1-5'
    - cron: '23 23 * * 1-5'
    - cron: '41 0 * * 2-6'
    - cron: '13 2 * * 2-6'
    - cron: '37 3 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_stock_prices.py
      - name: commit if changed
        run: |
          if git diff --quiet -- data/stocks/prices.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks/prices.json
          git commit -m "stock prices snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
