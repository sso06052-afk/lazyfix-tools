name: stock prices snapshot

# 주식 모의투자(토스 미니앱)가 읽는 종가 스냅샷을 갱신해요.
# 국내 장 마감 뒤(16:10 KST)와 미국 장 마감 뒤(07:10 KST) 하루 2회.
on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '40 8 * * 1-5'   # 국내 보조(예약 실행이 1~3시간 밀릴 때 대비)
    - cron: '10 22 * * 1-5'
    - cron: '40 23 * * 1-5'  # 미국 보조
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_stock_prices.py
      - name: commit if changed
        run: |
          if git diff --quiet -- data/stocks/prices.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks/prices.json
          git commit -m "stock prices snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
